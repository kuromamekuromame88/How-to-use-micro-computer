<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <link rel="icon" href="./roboconrobo.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="./roboconrobo.ico" type="image/x-icon">
  
    <title>制御班-マイコンの使い方ガイド</title>

    <link rel="stylesheet" href="./style/main.css">
  </head>
  <body>
    <main>

      <!-- 最初に表示されるタイトル -->
      <div class="title_start">
        <img src="./roboconrobo.ico">
        <p>制御班-マイコンの使い方ガイド</p>
        <p>クリックして開始</p>
      </div>

      <!-- トピック表示2次元コンテナ -->
      <div class="MainContainer">
        <div class="grid">
          <svg>
            <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="translate(0,0)">
          </svg>
        </div>
        <div class="world"></div>
        <div class="UITab"></div>
        
      </div>

    </main>

    <script src="./js/main.js"></script>
  </body>
</html>
